[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brightway-mcp"
version = "0.3.0"
description = "Model Context Protocol server exposing Brightway 2.5 LCA as agent tools, organized by ISO 14040/44 phase."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "SDAI Ecosystem" }]
license = { text = "MIT" }
dependencies = [
    "mcp==2.2.0",
    "fastmcp==4.0.4",
    "fastmcp-tasks==4.0.4",
    "bw2data>=4",
    "bw2calc>=2",
    "bw2io>=0.9",
    "bw2analyzer",
    "numpy",
    "pandas",
    "anyio>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio"]

[project.scripts]
brightway-mcp = "brightway_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
    "network: requires downloading a real background database (e.g. ecoinvent-3.10-biosphere via bw2io); deselected by default, run explicitly with `pytest -m network`",
]
